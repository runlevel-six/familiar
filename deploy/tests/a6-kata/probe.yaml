# SPDX-License-Identifier: Apache-2.0
# A6: a pod under the kata RuntimeClass, admitted by restricted Pod Security.
apiVersion: v1
kind: Namespace
metadata:
  name: kata-test
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Pod
metadata:
  name: kata-probe
  namespace: kata-test
spec:
  runtimeClassName: kata
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: probe
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "uname -r; nproc; grep MemTotal /proc/meminfo; sleep 3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
    resources:
      requests: {cpu: 250m, memory: 128Mi}
      limits: {cpu: 250m, memory: 128Mi}
