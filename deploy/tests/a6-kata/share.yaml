# A6: does Kata share a Ceph RBD volume over virtio-fs (safe) or pass the
# block device into the VM (unsafe with a second reader)? Apply after probe.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: share-test, namespace: kata-test}
spec: {accessModes: [ReadWriteOnce], storageClassName: ceph-block, resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Pod
metadata: {name: writer, namespace: kata-test}
spec:
  runtimeClassName: kata
  securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: w
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "while true; do date > /data/now; sleep 5; done"]
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
    volumeMounts: [{name: d, mountPath: /data}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: share-test}}]
---
apiVersion: v1
kind: Pod
metadata: {name: reader, namespace: kata-test}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: r
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "3600"]
    securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
    volumeMounts: [{name: d, mountPath: /data, readOnly: true}]
  volumes: [{name: d, persistentVolumeClaim: {claimName: share-test, readOnly: true}}]
