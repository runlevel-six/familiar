# Phase 1 (DRAFT, not applied). Design §4.2. All three namespaces enforce the
# restricted Pod Security Standard.
apiVersion: v1
kind: Namespace
metadata:
  name: familiar-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    familiar/managed: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: familiar-agents
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    familiar/managed: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: familiar-tools
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    familiar/managed: "true"
---
# host-read only (design §4.1): it needs the host's PID namespace, which the
# baseline and restricted levels forbid, so this namespace enforces
# privileged and warns at restricted. The pod itself is non-root with no
# capabilities and no hostPath mounts; everything else stays in
# familiar-tools under restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: familiar-host
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    familiar/managed: "true"
