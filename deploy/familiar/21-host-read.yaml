# SPDX-License-Identifier: Apache-2.0
# host-read (design §4.1): the node's own processes, outside Kubernetes too.
# It shares the host's PID namespace, so it lives in familiar-host, the only
# familiar namespace that allows that. The pod is otherwise as tight as the
# other tool servers: non-root, no capabilities, read-only root filesystem,
# no hostPath, no host network. Without ptrace rights it can read only what
# any user may (/proc/<pid>/stat and /cgroup), never command lines,
# environments, open files or another process's filesystem; and the
# world-readable sysfs block statistics of RBD volumes. Its only API access
# is listing pods and PersistentVolumes, to name each process's pod and each
# volume's claim, and to hide familiar's.
apiVersion: v1
kind: ServiceAccount
metadata: {name: host-read, namespace: familiar-host}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: familiar-host-read}
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumes] # pods: name each process's pod; PVs: map RBD images to claims
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: familiar-host-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: familiar-host-read}
subjects: [{kind: ServiceAccount, name: host-read, namespace: familiar-host}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-read
  namespace: familiar-host
  labels: &labels {app.kubernetes.io/name: host-read, app.kubernetes.io/part-of: familiar, familiar/kind: tool-server}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: host-read}}
  template:
    metadata: {labels: *labels}
    spec:
      serviceAccountName: host-read
      automountServiceAccountToken: true # needs its own token to list pods
      hostPID: true
      priorityClassName: familiar-low
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: host-read
          image: ghcr.io/runlevel-six/familiar-tools@sha256:78d43c6f8e7dc97fb2ffe5efd0220fddb155c4e417f80fd4df5d2d570380824a # 0.11.0-1be9983
          command: ["/host-read"]
          ports: [{name: mcp, containerPort: 8080}, {name: metrics, containerPort: 9100}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 96Mi}}
          readinessProbe: {httpGet: {path: /healthz, port: mcp}, periodSeconds: 15}
---
apiVersion: v1
kind: Service
metadata: {name: host-read, namespace: familiar-host, labels: {app.kubernetes.io/name: host-read}}
spec:
  selector: {app.kubernetes.io/name: host-read}
  ports: [{name: mcp, port: 8080, targetPort: mcp}, {name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: host-read-egress, namespace: familiar-host}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: host-read}}
  egress:
    - toEntities: [kube-apiserver]
      toPorts: [{ports: [{port: "6443", protocol: TCP}]}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata: {name: host-read-ingress, namespace: familiar-host}
spec:
  endpointSelector: {matchLabels: {app.kubernetes.io/name: host-read}}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: familiar-agents
            familiar/role: watch-officer
      toPorts: [{ports: [{port: "8080", protocol: TCP}]}]
    # Prometheus scrapes the RBD-to-claim mapping (metrics port only, never MCP).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: prometheus
      toPorts: [{ports: [{port: "9100", protocol: TCP}]}]
---
# familiar_rbd_volume_info: which claim each RBD device belongs to, so
# metrics-query can keep per-volume history from node-exporter's counters.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: host-read, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [familiar-host]}
  selector: {matchLabels: {app.kubernetes.io/name: host-read}}
  endpoints: [{port: metrics, interval: 60s}]
