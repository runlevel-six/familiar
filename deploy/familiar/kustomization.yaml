# familiar Phase 1, generic base. Site-specific values (the cert-probe host
# list, Matrix IDs) are placeholders here and set by an overlay: see
# ../overlays/example/. The real overlay is kept outside the public tree.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - 01-priority-and-quotas.yaml
  - 02-default-deny.yaml
  - 10-model-gate.yaml
  - 20-tool-servers.yaml
  - 21-host-read.yaml
  - hermes
